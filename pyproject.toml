[project]
name = "ai-data-analyst-demo"
version = "1.1.0"
description = "Streamlit + LangGraph autonomous AI data analyst for a classroom demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45,<2",
    "langgraph>=0.6,<2",
    "langchain-openai>=0.3,<2",
    "langchain-core>=0.3,<2",
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "plotly>=6,<7",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1,<2",
    "pyarrow>=19,<27",
    "mcp>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
